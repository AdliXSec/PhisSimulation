version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: phisim_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: phisimulation
      POSTGRES_USER: phisim_admin
      POSTGRES_PASSWORD: phisim_secret_2026
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/triggers.sql:/docker-entrypoint-initdb.d/02-triggers.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phisim_admin -d phisimulation"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: phisim_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
