[providers.python]

[phases.setup]
aptPkgs = [
    "libnss3", 
    "libatk-bridge2.0-0", 
    "libx11-xcb1", 
    "libdrm2", 
    "libxkbcommon0", 
    "libxcomposite1", 
    "libxdamage1", 
    "libxfixes3", 
    "libxrandr2", 
    "libgbm1", 
    "libasound2", 
    "libpango-1.0-0",
    "libxshmfence1"
]

[phases.install]
cmds = [
    "python -m venv /app/.venv",
    ". /app/.venv/bin/activate",
    "pip install -r requirements.txt",
    "playwright install chromium"
]
